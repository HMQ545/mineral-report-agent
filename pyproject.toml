[project]
name = "minereport"
version = "0.1.0"
description = "Mining-rights daily report agent built on MCP (news / mineral resources PDF / LME prices)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mcp==1.18.0",
    "langchain-core==0.3.72",
    "langchain-mcp-adapters==0.1.11",
    "langgraph==0.6.11",
    "langchain-deepseek==0.1.4",
    "pdfplumber==0.11.10",
    "httpx==0.28.1",
    "pydantic==2.11.7",
    "Jinja2==3.1.6",
    "tenacity==8.5.0",
    "python-dotenv==1.0.1",
    "lxml==5.3.1",
    "langgraph-checkpoint-sqlite==3.0.3",
]

# uv's default dev group: installed by `uv sync` / `uv run`, excluded in the
# Docker image with `uv sync --frozen --no-dev`.
[dependency-groups]
dev = [
    "pytest==7.4.4",
    "anyio==4.9.0",
]

[project.scripts]
minereport-news = "minereport.news.server:main"
minereport-pdf = "minereport.pdf.server:main"
minereport-price = "minereport.price.server:main"
minereport-agent = "minereport.agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minereport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real external data sources (network required)",
]
addopts = "-q"

